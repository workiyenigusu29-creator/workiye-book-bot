<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የመጽሐፍ መሸጫ መደብር | Book Store</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --success: #16a34a;
            --success-hover: #15803d;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #0f172a;
            --muted: #475569;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #e2e8f0 0%, var(--bg) 320px);
            color: var(--text);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 60%, #0369a1 100%);
            color: #fff;
            padding: 36px 20px 42px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.22);
        }

        .hero-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 5px 14px;
            border-radius: 999px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            letter-spacing: 0.03em;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 2rem;
        }

        header p {
            margin: 0 auto 20px;
            max-width: 660px;
            color: #e2e8f0;
            font-size: 1.02rem;
            line-height: 1.6;
        }

        .bot-banner-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #229ED9;
            color: #fff;
            text-decoration: none;
            padding: 11px 22px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.96rem;
            box-shadow: 0 4px 14px rgba(34, 158, 217, 0.4);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .bot-banner-btn:hover {
            background: #1b86b8;
            transform: translateY(-2px);
        }

        .container {
            max-width: 1100px;
            margin: -18px auto 50px;
            padding: 0 20px;
        }

        /* Controls bar */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 18px;
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
            margin-bottom: 28px;
        }

        .search-input {
            flex: 1 1 260px;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 0.95rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: var(--text);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
            gap: 26px;
        }

        .book-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 8px 22px rgba(15, 23, 42, 0.07);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #e2e8f0;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .book-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 32px rgba(15, 23, 42, 0.13);
        }

        /* 3D Book Promotional Stage */
        .book-3d-stage {
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px 0 24px;
            background: radial-gradient(circle at center, #f1f5f9 0%, #ffffff 75%);
            border-radius: 12px;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .book-3d {
            position: relative;
            width: 160px;
            height: 222px;
            transform-style: preserve-3d;
            transform: rotateY(-22deg) rotateX(6deg);
            transition: transform 0.35s ease;
            border-radius: 4px 12px 12px 4px;
            box-shadow: 14px 18px 28px rgba(15, 23, 42, 0.3);
        }

        .book-card:hover .book-3d {
            transform: rotateY(-8deg) rotateX(3deg) translateY(-4px) scale(1.03);
        }

        /* Book Spine */
        .book-3d::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 18px;
            height: 100%;
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.42), rgba(255, 255, 255, 0.22), rgba(0, 0, 0, 0.28));
            border-radius: 4px 0 0 4px;
            z-index: 3;
        }

        /* Book Page Edges */
        .book-3d::after {
            content: "";
            position: absolute;
            top: 4px;
            right: -6px;
            width: 6px;
            height: calc(100% - 8px);
            background: repeating-linear-gradient(
                90deg,
                #f8fafc,
                #f8fafc 1px,
                #cbd5e1 1px,
                #cbd5e1 2px
            );
            border-radius: 0 3px 3px 0;
        }

        .book-cover-art {
            width: 100%;
            height: 100%;
            border-radius: 4px 12px 12px 4px;
            background: var(--cover-grad, linear-gradient(145deg, #1d4ed8, #0f172a));
            color: #fff;
            padding: 14px 14px 12px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        .book-cover-art img.custom-cover {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px 12px 12px 4px;
            z-index: 1;
        }

        .book-cover-overlay {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .book-cover-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .book-cover-badge {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: rgba(255, 255, 255, 0.22);
            padding: 3px 7px;
            border-radius: 4px;
        }

        .book-illustration {
            width: 64px;
            height: 64px;
            margin: 6px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 50%;
            padding: 10px;
            box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.18);
        }

        .book-illustration svg {
            width: 100%;
            height: 100%;
        }

        .book-cover-label {
            font-size: 0.82rem;
            font-weight: 700;
            line-height: 1.28;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-cover-author {
            font-size: 0.64rem;
            color: rgba(255, 255, 255, 0.85);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            padding-top: 4px;
            margin-top: 4px;
        }

        .book-category-tag {
            display: inline-block;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--accent);
            background: #e0f2fe;
            padding: 3px 9px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .book-title {
            font-size: 1.12rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--primary);
            line-height: 1.4;
        }

        .book-preface-snippet {
            font-size: 0.9rem;
            color: var(--muted);
            line-height: 1.55;
            margin-bottom: 14px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-top: 10px;
            border-top: 1px solid #f1f5f9;
        }

        .book-price {
            font-size: 1.18rem;
            color: var(--success);
            font-weight: 800;
        }

        .book-compiler {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-preface {
            background-color: #f1f5f9;
            color: var(--primary);
            border: 1px solid #cbd5e1;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-preface:hover {
            background-color: #e2e8f0;
        }

        .btn-buy {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.92rem;
            font-weight: 700;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .btn-buy:hover {
            background-color: var(--accent-hover);
        }

        .btn-buy:active {
            transform: scale(0.98);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background-color: #fff;
            padding: 26px;
            border-radius: 16px;
            max-width: 560px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.32);
            position: relative;
        }

        .close {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 26px;
            font-weight: bold;
            cursor: pointer;
            color: #94a3b8;
            line-height: 1;
        }

        .close:hover {
            color: #0f172a;
        }

        .modal h2 {
            margin: 0 24px 10px 0;
            font-size: 1.3rem;
            color: var(--primary);
            line-height: 1.35;
        }

        /* Preface Modal Layout */
        .preface-hero {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            background: #f8fafc;
            padding: 16px;
            border-radius: 12px;
            margin: 14px 0;
            border: 1px solid #e2e8f0;
        }

        .preface-cover-wrap {
            flex: 0 0 auto;
            margin: 0 auto;
        }

        .preface-summary {
            flex: 1 1 240px;
        }

        .preface-box {
            background: #ffffff;
            border-left: 4px solid var(--accent);
            padding: 14px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
            margin: 14px 0;
            line-height: 1.7;
            font-size: 0.96rem;
            color: #1e293b;
        }

        .highlights-list {
            margin: 10px 0 18px;
            padding-left: 20px;
            color: #334155;
            line-height: 1.65;
            font-size: 0.93rem;
        }

        .payment-info {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 14px;
            border-radius: 10px;
            margin: 14px 0;
            line-height: 1.65;
            font-size: 0.95rem;
        }

        .payment-info p {
            margin: 4px 0;
        }

        .form-group {
            margin-top: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.92rem;
        }

        .form-group input[type="text"],
        .form-group select,
        .form-group input[type="file"] {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.92rem;
        }

        .receipt-preview {
            margin-top: 10px;
            display: none;
            text-align: center;
        }

        .receipt-preview img {
            max-width: 100%;
            max-height: 150px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }

        .btn-submit {
            margin-top: 16px;
            background-color: var(--success);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: var(--success-hover);
        }

        .bot-actions {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px dashed #cbd5e1;
            display: none;
        }

        .bot-actions.visible {
            display: block;
        }

        .btn-telegram {
            display: block;
            text-align: center;
            background: #229ED9;
            color: #fff;
            text-decoration: none;
            padding: 11px;
            border-radius: 8px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .btn-telegram:hover {
            background: #1b86b8;
        }

        .btn-copy {
            width: 100%;
            background: #e2e8f0;
            color: #0f172a;
            border: none;
            padding: 9px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-copy:hover {
            background: #cbd5e1;
        }

        footer {
            text-align: center;
            padding: 24px 16px;
            color: var(--muted);
            font-size: 0.9rem;
            border-top: 1px solid #e2e8f0;
            background: #fff;
        }
    </style>
</head>
<body>

<header>
    <div class="hero-badge">📚 ዲጂታል የመጽሐፍ መደብር | አዘጋጅ፡ ወርቅዬ ንጉሱ ቸሩ</div>
    <h1>📖 የመጽሐፍ መሸጫ መደብር</h1>
    <p>እውቀትን፣ ሙያዊ ብቃትን፣ ባህላዊ ህክምናን እና የስኬት መርሆችን የያዙ መጽሐፍትን መቅድማቸውን በማንበብ ይምረጡና በቀላሉ ይግዙ።</p>
    <a class="bot-banner-btn" href="https://t.me/Lisanwork12_Bot" target="_blank" rel="noopener noreferrer">
        🤖 ወደ @Lisanwork12_Bot ይሂዱ
    </a>
</header>

<div class="container">
    <div class="controls">
        <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="🔍 የመጽሐፍ ስም ወይም ርዕስ ይፈልጉ..."
            oninput="renderBooks()"
        >
        <div class="filter-group">
            <button class="filter-btn active" data-price="all" onclick="setPriceFilter('all', this)">ሁሉም</button>
            <button class="filter-btn" data-price="100" onclick="setPriceFilter('100', this)">100 ብር</button>
            <button class="filter-btn" data-price="150" onclick="setPriceFilter('150', this)">150 ብር</button>
            <button class="filter-btn" data-price="200" onclick="setPriceFilter('200', this)">200 ብር</button>
        </div>
    </div>

    <div class="book-grid" id="bookList"></div>
</div>

<!-- Preface / Promotional Preview Modal -->
<div id="prefaceModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closePrefaceModal()">&times;</span>
        <span class="book-category-tag" id="prefCategory"></span>
        <h2 id="prefTitle"></h2>

        <div class="preface-hero">
            <div class="preface-cover-wrap" id="prefCoverContainer"></div>
            <div class="preface-summary">
                <p style="margin: 0 0 8px;"><strong>አዘጋጅ፡</strong> ወርቅዬ ንጉሱ ቸሩ</p>
                <p style="margin: 0 0 8px;"><strong>ዋጋ፡</strong> <span id="prefPrice" style="color: #16a34a; font-weight: 800; font-size: 1.1rem;"></span></p>
                <p style="margin: 0; font-size: 0.9rem; color: #475569;"><strong>ቅርጸት፡</strong> ዲጂታል መጽሐፍ (PDF)</p>
            </div>
        </div>

        <h3 style="margin: 12px 0 6px; font-size: 1.05rem; color: #0f172a;">📜 የመጽሐፉ መቅድም (Preface)</h3>
        <div class="preface-box"
