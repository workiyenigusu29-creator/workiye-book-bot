<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የመጽሐፍ መሸጫ መደብር | Book Store</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #2c3e50;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }
        .book-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .book-title {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .book-price {
            font-size: 1.1rem;
            color: #27ae60;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .btn-buy {
            background-color: #2980b9;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            text-align: center;
        }
        .btn-buy:hover {
            background-color: #1f6391;
        }
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fff;
            padding: 25px;
            border-radius: 8px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .close {
            float: right;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            color: #aaa;
        }
        .close:hover {
            color: #000;
        }
        .payment-info {
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
            line-height: 1.6;
        }
        .form-group {
            margin-top: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .form-group input[type="file"] {
            width: 100%;
        }
        .btn-submit {
            margin-top: 15px;
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #1e8449;
        }
    </style>
</head>
<body>

<header>
    <h1>📖 የመጽሐፍ መሸጫ መደብር</h1>
    <p>ጥራት ያላቸው መጽሐፍትን በመምረጥ ይግዙ</p>
</header>

<div class="container">
    <div class="book-grid" id="bookList"></div>
</div>

<!-- Payment Modal -->
<div id="paymentModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="modalBookTitle"></h2>
        <p><strong>ዋጋ:</strong> <span id="modalBookPrice" style="color: #27ae60;"></span></p>
        
        <div class="payment-info">
            <p>መጽሐፉን ለመግዛት ከታች ባሉት አካውንቶች ክፍያ ይፈጽሙ፡</p>
            <p>🟢 <strong>Telebirr:</strong> 0940277822 (workiye Nigusu)</p>
            <p>🏦 <strong>የኢትዮጵያ ንግድ ባንክ (CBE):</strong> 1000307290247</p>
        </div>

        <form onsubmit="submitPayment(event)">
            <div class="form-group">
                <label for="receipt">የደረሰኝ ፎቶ (Screenshot) ያስገቡ:</label>
                <input type="file" id="receipt" accept="image/*" required>
            </div>
            <button type="submit" class="btn-submit">ማረጋገጫ ላክ</button>
        </form>
    </div>
</div>

<script>
    const BOOKS = [
        { id: "book_1", title: "ሀገር በቀል እፅዋትና የህክምና ጥቅማቸው", price: "100 ብር", file: "medcine book.pdf" },
        { id: "book_2", title: "የትምህርት ሙያዊ ብቃትና ተግባራዊ አፈጻጸም", price: "150 ብር", file: "የትምህርት ሙያዊ ብቃት.pdf" },
        { id: "book_3", title: "Professional competence and practical performance in education", price: "150 ብር", file: "Educational competency.pdf" },
        { id: "book_4", title: "የመሪነት ጥበብ", price: "200 ብር", file: "የመሪነት ጥበብ.pdf" },
        { id: "book_5", title: "የስኬት ምስጢር", price: "200 ብር", file: "የስኬት ምስጢር.pdf" },
        { id: "book_6", title: "የሲቭል ሰርቭስ የብቃት ምዘና ጥያቄዎች 457 በላይ", price: "200 ብር", file: "civil service exam.pdf" }
    ];

    const bookListEl = document.getElementById("bookList");

    BOOKS.forEach(book => {
        const card = document.createElement("div");
        card.className = "book-card";
        card.innerHTML = `
            <div>
                <div class="book-title">📖 ${book.title}</div>
                <div class="book-price">${book.price}</div>
            </div>
            <button class="btn-buy" onclick="openModal('${book.id}')">መጽሐፉን ይግዙ</button>
        `;
        bookListEl.appendChild(card);
    });

    function openModal(bookId) {
        const book = BOOKS.find(b => b.id === bookId);
        if (!book) return;
        document.getElementById("modalBookTitle").innerText = book.title;
        document.getElementById("modalBookPrice").innerText = book.price;
        document.getElementById("paymentModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("paymentModal").style.display = "none";
    }

    function submitPayment(event) {
        event.preventDefault();
        alert("✅ የክፍያ ማረጋገጫዎ ደርሷል! መጽሐፍዎ በቅርቡ ይላክልዎታል።");
        closeModal();
        event.target.reset();
    }

    window.onclick = function(event) {
        const modal = document.getElementById("paymentModal");
        if (event.target === modal) {
            closeModal();
        }
    }
</script>

</body>
</html>
